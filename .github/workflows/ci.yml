name: Testar base StudyBuddy

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências e recuperar assets
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
